# Opciones de drift_dev para las migraciones paso a paso (schema v4 en
# adelante): `dart run drift_dev make-migrations` guarda un volcado del
# schema por version en drift_schemas/ y genera los pasos
# (app_database.steps.dart) y los tests de schema en test/drift/.
targets:
  $default:
    builders:
      drift_dev:
        options:
          databases:
            aura: lib/data/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
